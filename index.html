<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>The Last Christmas Wish</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="film" aria-label="The Last Christmas Wish animated short film">
    <canvas id="screen"></canvas>
    <div id="title-card" aria-live="polite">
      <div class="eyebrow">A CHRISTMAS STORY</div>
      <h1>THE LAST<br>CHRISTMAS WISH</h1>
      <p>A story about the warmth we give away.</p>
    </div>
    <div id="end-card" aria-live="polite">
      <p>THE GREATEST GIFT</p>
      <h2>IS A KIND HEART.</h2>
    </div>
    <div id="status" role="status">Preparing the film…</div>
    <noscript>This film requires JavaScript and WebGL.</noscript>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
